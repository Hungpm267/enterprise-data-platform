ecommerce_bigquery:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'data-engineering-504901') }}"
      dataset: "{{ env_var('GCP_STAGING_DATASET', 'staging') }}"
      threads: 4
      keyfile: "{{ env_var('GCP_KEY_FILE', 'gcp_key.json') }}"
      location: asia-southeast1
