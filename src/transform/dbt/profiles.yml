ecommerce_bigquery:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account-json
      project: "{{ env_var('GCP_PROJECT_ID', 'data-engineering-504901') }}"
      dataset: "{{ env_var('GCP_STAGING_DATASET', 'staging') }}"
      threads: 4
      keyfile_json: "{{ env_var('GCP_SA_KEY_JSON') }}"
      location: asia-southeast1
