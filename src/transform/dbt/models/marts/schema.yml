version: 2

models:
  - name: fct_orders
    description: "Central Fact table for e-commerce orders at order-header granularity."
    columns:
      - name: order_id
        description: "Primary key of the order."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key referencing dim_customers."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: order_status
        description: "Current lifecycle status of the order."
        tests:
          - not_null
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'invoiced', 'processing', 'unavailable', 'created', 'approved']
      - name: total_order_value
        description: "Total aggregated monetary value of items in the order."
        tests:
          - not_null

  - name: fct_order_items
    description: "Fact table containing line-item detail for every product in an order."
    columns:
      - name: order_item_id
        description: "Primary key for the order item record."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key referencing fct_orders."
        tests:
          - not_null
      - name: product_id
        description: "Foreign key referencing dim_products."
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id

  - name: dim_customers
    description: "Dimension table containing customer geographic profiles."
    columns:
      - name: customer_id
        description: "Primary key identifying unique customers."
        tests:
          - unique
          - not_null

  - name: dim_products
    description: "Dimension table containing product categorization."
    columns:
      - name: product_id
        description: "Primary key identifying unique products."
        tests:
          - unique
          - not_null
