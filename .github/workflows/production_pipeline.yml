name: Production Enterprise ELT Pipeline (Postgres & Crypto)

on:
  schedule:
    # Run every 4 hours automatically (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      connector:
        description: 'Select connector to run (all, postgres_db, crypto_api)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - postgres_db
          - crypto_api
      full_refresh:
        description: 'Force full-refresh rebuild of incremental models'
        required: false
        default: false
        type: boolean
  push:
    branches: [ main ]

jobs:
  run-pipeline:
    name: Execute Unified ELT Pipeline & Quality Verification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONPATH: .
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SCHEMA: ${{ secrets.DB_SCHEMA || 'public' }}
      PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
      PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
      GCP_PROJECT_ID: 'data-engineering-504901'
      GCP_GCS_BUCKET: 'ecommerce-data-lake-504901'
      GCP_STAGING_DATASET: 'staging'
      GCP_MARTS_DATASET: 'marts'
      GCP_KEY_FILE: 'gcp_key.json'
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      LANDING_DIR: 'data/landing'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11 & Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Platform Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt

      - name: Run Postgres E-Commerce Pipeline
        if: "${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.connector == 'all' || inputs.connector == 'postgres_db' }}"
        run: |
          REFRESH_FLAG=""
          if [ "${{ inputs.full_refresh }}" = "true" ]; then
            REFRESH_FLAG="--full-refresh"
          fi
          python main.py --connector postgres_db $REFRESH_FLAG

      - name: Run CoinGecko Crypto Market API Pipeline
        if: "${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.connector == 'all' || inputs.connector == 'crypto_api' }}"
        run: |
          REFRESH_FLAG=""
          if [ "${{ inputs.full_refresh }}" = "true" ]; then
            REFRESH_FLAG="--full-refresh"
          fi
          python main.py --connector crypto_api $REFRESH_FLAG

      - name: Send Consolidated Telegram Executive Summary
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram Secrets not configured. Skipping Telegram notification."
            exit 0
          fi

          WORKFLOW_STATUS="${{ job.status }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VN_TIMESTAMP=$(TZ='Asia/Ho_Chi_Minh' date '+%d/%m/%Y %H:%M:%S')
          TARGET_CONNECTOR="${{ inputs.connector || 'all' }}"
          
          if [ "${{ github.event_name }}" = "schedule" ]; then
            EVENT_DESC="⏰ Scheduled Cron (Every 4 Hours)"
          elif [ "${{ github.event_name }}" = "push" ]; then
            EVENT_DESC="📦 Git Push (${SHORT_SHA})"
          else
            EVENT_DESC="🔘 Manual Trigger (Connector: ${TARGET_CONNECTOR})"
          fi

          if [ "$WORKFLOW_STATUS" = "success" ]; then
            MESSAGE="🟢 *ENTERPRISE DATA PLATFORM BATCH SUCCESS* 🚀%0A%0A📁 *Repository:* \`${{ github.repository }}\`%0A🌿 *Branch:* \`${{ github.ref_name }}\`%0A⚡ *Trigger:* ${EVENT_DESC}%0A🕒 *Thời gian (VN UTC+7):* \`${VN_TIMESTAMP}\`%0A☁️ *Data Lake:* \`Google Cloud Storage (GCS)\`%0A🏢 *Data Warehouse:* \`Google BigQuery\`%0A🛠️ *Transform Engine:* \`dbt-bigquery\`%0A%0A📊 *Executive Pipeline Status:*%0A• 🐘 *PostgreSQL DB:* 6/6 Tables Ingested & Merged%0A• 🪙 *Crypto API:* Top 100 Coins & Global Market Synced%0A• 🧪 *Data Quality:* 35/35 dbt Tests PASSED (100%25)%0A• 🎯 *Data Marts:* \`marts.dim_*\`, \`marts.fct_*\`, \`marts.wide_*\` Up to date%0A%0A✅ *Result:* All pipelines completed successfully.%0A%0A🔗 [Xem Chi Tiết Log Trên GitHub Actions](${RUN_URL})"
          else
            MESSAGE="🔴 *ENTERPRISE DATA PLATFORM BATCH FAILED* ⚠️%0A%0A📁 *Repository:* \`${{ github.repository }}\`%0A🌿 *Branch:* \`${{ github.ref_name }}\`%0A⚡ *Trigger:* ${EVENT_DESC}%0A🕒 *Thời gian (VN UTC+7):* \`${VN_TIMESTAMP}\`%0A☁️ *Data Lake:* \`Google Cloud Storage (GCS)\`%0A🏢 *Data Warehouse:* \`Google BigQuery\`%0A%0A❌ *Result:* Pipeline encountered an error during execution.%0A%0A🔍 [Kiểm Tra Chi Tiết Lỗi Trên GitHub Actions](${RUN_URL})"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "text=${MESSAGE}"

      - name: Cleanup Credentials
        if: always()
        run: |
          rm -f gcp_key.json
