name: Production Enterprise ELT Pipeline (Postgres & Crypto)

on:
  schedule:
    # Run every 4 hours automatically (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      connector:
        description: 'Select connector to run (all, postgres_db, crypto_api)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - postgres_db
          - crypto_api
      full_refresh:
        description: 'Force full-refresh rebuild of incremental models'
        required: false
        default: false
        type: boolean
  push:
    branches: [ main ]

jobs:
  run-pipeline:
    name: Execute Unified ELT Pipeline & Quality Verification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONPATH: .
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SCHEMA: ${{ secrets.DB_SCHEMA || 'public' }}
      PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
      PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
      GCP_PROJECT_ID: 'data-engineering-504901'
      GCP_GCS_BUCKET: 'ecommerce-data-lake-504901'
      GCP_STAGING_DATASET: 'staging'
      GCP_MARTS_DATASET: 'marts'
      GCP_KEY_FILE: 'gcp_key.json'
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      LANDING_DIR: 'data/landing'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11 & Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Platform Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt

      - name: Run Postgres E-Commerce Pipeline
        if: "${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.connector == 'all' || inputs.connector == 'postgres_db' }}"
        run: |
          REFRESH_FLAG=""
          if [ "${{ inputs.full_refresh }}" = "true" ]; then
            REFRESH_FLAG="--full-refresh"
          fi
          python main.py --connector postgres_db $REFRESH_FLAG

      - name: Run CoinGecko Crypto Market API Pipeline
        if: "${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.connector == 'all' || inputs.connector == 'crypto_api' }}"
        run: |
          REFRESH_FLAG=""
          if [ "${{ inputs.full_refresh }}" = "true" ]; then
            REFRESH_FLAG="--full-refresh"
          fi
          python main.py --connector crypto_api $REFRESH_FLAG

      - name: Send Detailed Telegram Pipeline Report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python -m src.utils.telegram_reporter ${{ job.status }}

      - name: Cleanup Credentials
        if: always()
        run: |
          rm -f gcp_key.json
