name: Automated E-Commerce GCP ELT Pipeline

on:
  schedule:
    # Runs automatically every 1 hour and 15 minutes (75 minutes)
    - cron: '0 0,5,10,15,20 * * *'
    - cron: '15 1,6,11,16,21 * * *'
    - cron: '30 2,7,12,17,22 * * *'
    - cron: '45 3,8,13,18,23 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Web UI
  push:
    branches: [ main ]

jobs:
  run-elt-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11 & Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 📦 Fast Install Dependencies (Cached)
        run: |
          pip install --prefer-binary -r requirements.txt

      - name: 🔑 Check Secrets & GCP Configuration
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "Checking Secrets availability..."
          [ -n "$DB_HOST" ] && echo "✓ DB_HOST secret found" || echo "❌ DB_HOST secret MISSING!"
          [ -n "$DB_PASSWORD" ] && echo "✓ DB_PASSWORD secret found" || echo "❌ DB_PASSWORD secret MISSING!"
          [ -n "$GCP_SA_KEY" ] && echo "✓ GCP_SA_KEY secret found" || echo "❌ GCP_SA_KEY secret MISSING!"

      - name: 🚀 Execute GCP Modern ELT Pipeline (Postgres -> GCS -> BigQuery -> dbt)
        env:
          PYTHONPATH: .
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: 'data-engineering-504901'
          GCP_GCS_BUCKET: 'ecommerce-data-lake-504901'
          GCP_STAGING_DATASET: 'staging'
          GCP_MARTS_DATASET: 'marts'
          LANDING_DIR: 'data/landing'
        run: |
          python main.py

      - name: 📢 Send Detailed Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram Secrets not configured yet. Skipping Telegram notification."
            exit 0
          fi

          WORKFLOW_STATUS="${{ job.status }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TRIGGER_EVENT="${{ github.event_name }}"
          
          if [ "$TRIGGER_EVENT" = "schedule" ]; then
            EVENT_DESC="⏰ Lập lịch tự động (1h15m/lần)"
          elif [ "$TRIGGER_EVENT" = "workflow_dispatch" ]; then
            EVENT_DESC="👤 Kích hoạt thủ công (Web UI)"
          else
            EVENT_DESC="📦 Push Commit (${SHORT_SHA})"
          fi

          if [ "$WORKFLOW_STATUS" = "success" ]; then
            MESSAGE="🎉 *GCP MODERN ELT PIPELINE SUCCESS* 🟢%0A%0A📌 *Repository:* \`${{ github.repository }}\`%0A🌿 *Branch:* \`${{ github.ref_name }}\`%0A💡 *Nguồn kích hoạt:* ${EVENT_DESC}%0A☁️ *Data Lake:* \`Google Cloud Storage (GCS)\`%0A⚡ *Data Warehouse:* \`Google BigQuery\`%0A🛠️ *Transform Engine:* \`dbt-bigquery\`%0A%0A📋 *Tóm Tắt Các Bước Đã Chạy:*%0A1️⃣ *Extract:* Trích xuất 6 bảng thô từ Postgres ➔ Parquet.%0A2️⃣ *Load GCS:* Nạp 6 file Parquet lên GCS Bucket \`gs://ecommerce-data-lake-504901/\`.%0A3️⃣ *Load BigQuery:* Nạp dữ liệu Parquet từ GCS vào BigQuery dataset \`staging.stg_raw_*\`.%0A4️⃣ *dbt Transform:* Thực thi SQL models dbt-bigquery ➔ Tạo Star Schema Data Marts (\`marts.dim_*\`, \`marts.fct_*\`).%0A%0A✅ *Kết quả:* Dữ liệu sẵn sàng phục vụ Looker Studio!%0A%0A🔗 [🌐 Xem Chi Tiết Log Execution Trên GitHub]($RUN_URL)"
          else
            MESSAGE="🚨 *GCP MODERN ELT PIPELINE FAILED* 🔴%0A%0A📌 *Repository:* \`${{ github.repository }}\`%0A🌿 *Branch:* \`${{ github.ref_name }}\`%0A💡 *Nguồn kích hoạt:* ${EVENT_DESC}%0A☁️ *Data Lake:* \`Google Cloud Storage (GCS)\`%0A⚡ *Data Warehouse:* \`Google BigQuery\`%0A%0A⚠️ *Trạng thái:* Phát sinh sự cố trong quá trình Extract, GCS Upload, BigQuery Load hoặc dbt Transform!%0A%0A🔗 [🔍 Kiểm Tra Nhật Ký Lỗi Trực Tiếp Trên GitHub]($RUN_URL)"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "text=${MESSAGE}"
