name: Automated E-Commerce ELT Pipeline

on:
  schedule:
    # Runs automatically every 45 minutes continuously
    - cron: '*/45 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Web UI
  push:
    branches: [ main ]

jobs:
  run-elt-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔑 Check Secrets Configuration
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Checking Secrets availability..."
          [ -n "$DB_HOST" ] && echo "✓ DB_HOST secret found" || echo "❌ DB_HOST secret MISSING!"
          [ -n "$DB_PORT" ] && echo "✓ DB_PORT secret found" || echo "❌ DB_PORT secret MISSING!"
          [ -n "$DB_NAME" ] && echo "✓ DB_NAME secret found" || echo "❌ DB_NAME secret MISSING!"
          [ -n "$DB_USER" ] && echo "✓ DB_USER secret found" || echo "❌ DB_USER secret MISSING!"
          [ -n "$DB_PASSWORD" ] && echo "✓ DB_PASSWORD secret found" || echo "❌ DB_PASSWORD secret MISSING!"

      - name: 🚀 Execute ELT Pipeline (Extract -> Load -> Transform)
        env:
          PYTHONPATH: .
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
          LANDING_DIR: 'data/landing'
        run: |
          python main.py

      - name: 🔍 Inspect Data Warehouse Results
        env:
          PYTHONPATH: .
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
        run: |
          python view_dw_tables.py

      - name: 📢 Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram Secrets not configured yet. Skipping Telegram notification."
            exit 0
          fi

          WORKFLOW_STATUS="${{ job.status }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          if [ "$WORKFLOW_STATUS" = "success" ]; then
            MESSAGE="🚀 *ELT PIPELINE SUCCESSFUL* 🟢%0A%0A📌 *Repository:* \`${{ github.repository }}\`%0A⏰ *Lịch chạy:* \`45 phút / lần\`%0A📊 *Trạng thái:* Tất cả 6 bảng Extracted, Loaded & Transformed thành công.%0A🔗 [Xem Chi Tiết Log Execution]($RUN_URL)"
          else
            MESSAGE="⚠️ *ELT PIPELINE FAILED* 🔴%0A%0A📌 *Repository:* \`${{ github.repository }}\`%0A⏰ *Lịch chạy:* \`45 phút / lần\`%0A💥 *Trạng thái:* Phát sinh lỗi trong quá trình thực thi!%0A🔗 [Xem Chi Tiết Lỗi Trực Tiếp]($RUN_URL)"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "text=${MESSAGE}"
