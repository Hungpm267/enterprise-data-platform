name: Automated Enterprise GCP ELT Pipeline

on:
  schedule:
    # Runs automatically every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Web UI
  push:
    branches: [ main ]

jobs:
  run-elt-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 & Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Fast Install Dependencies (Cached)
        run: |
          pip install --prefer-binary -r requirements.txt

      - name: Check Secrets & GCP Configuration
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "Checking Secrets availability..."
          [ -n "$DB_HOST" ] && echo "DB_HOST secret found" || echo "DB_HOST secret MISSING!"
          [ -n "$DB_PASSWORD" ] && echo "DB_PASSWORD secret found" || echo "DB_PASSWORD secret MISSING!"
          [ -n "$GCP_SA_KEY" ] && echo "GCP_SA_KEY secret found" || echo "GCP_SA_KEY secret MISSING!"

      - name: Execute GCP Modern ELT Pipeline (Postgres -> GCS -> BigQuery -> dbt)
        env:
          PYTHONPATH: .
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: 'data-engineering-504901'
          GCP_GCS_BUCKET: 'ecommerce-data-lake-504901'
          GCP_STAGING_DATASET: 'staging'
          GCP_MARTS_DATASET: 'marts'
          LANDING_DIR: 'data/landing'
        run: |
          python main.py

      - name: Send Detailed Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram Secrets not configured yet. Skipping Telegram notification."
            exit 0
          fi

          WORKFLOW_STATUS="${{ job.status }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TRIGGER_EVENT="${{ github.event_name }}"
          
          if [ "$TRIGGER_EVENT" = "schedule" ]; then
            EVENT_DESC="Scheduled Cron (Every 2 Hours)"
          elif [ "$TRIGGER_EVENT" = "workflow_dispatch" ]; then
            EVENT_DESC="Manual Trigger (GitHub Web UI)"
          else
            EVENT_DESC="Git Push (${SHORT_SHA})"
          fi

          if [ "$WORKFLOW_STATUS" = "success" ]; then
            MESSAGE="*ENTERPRISE DATA PLATFORM ELT SUCCESS*%0A%0A*Repository:* \`${{ github.repository }}\`%0A*Branch:* \`${{ github.ref_name }}\`%0A*Trigger:* ${EVENT_DESC}%0A*Data Lake:* \`Google Cloud Storage (GCS)\`%0A*Data Warehouse:* \`Google BigQuery\`%0A*Transform Engine:* \`dbt-bigquery\`%0A%0A*Pipeline Execution Summary:*%0A1. *Extract:* 6 raw tables extracted from Postgres to Parquet.%0A2. *Load GCS:* Parquet files uploaded to GCS Data Lake.%0A3. *Load BigQuery:* Bulk loaded Parquet from GCS into BigQuery staging tables.%0A4. *dbt Transform:* Executed dbt-bigquery incremental merge models.%0A5. *dbt Test:* All 17 automated data quality tests PASSED (100%25).%0A%0A*Result:* Staging and Data Marts successfully synchronized.%0A%0A[View Detailed Execution Logs on GitHub Actions](${RUN_URL})"
          else
            MESSAGE="*ENTERPRISE DATA PLATFORM ELT FAILED*%0A%0A*Repository:* \`${{ github.repository }}\`%0A*Branch:* \`${{ github.ref_name }}\`%0A*Trigger:* ${EVENT_DESC}%0A*Data Lake:* \`Google Cloud Storage (GCS)\`%0A*Data Warehouse:* \`Google BigQuery\`%0A%0A*Result:* Pipeline encountered an error during execution.%0A%0A[Inspect Error Logs on GitHub Actions](${RUN_URL})"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "text=${MESSAGE}"