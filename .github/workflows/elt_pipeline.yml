name: Automated E-Commerce ELT Pipeline

on:
  schedule:
    # Runs automatically at 02:00 AM ICT / Vietnam time (19:00 UTC)
    - cron: '0 19 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Web UI
  push:
    branches: [ main ]

jobs:
  run-elt-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Execute ELT Pipeline (Extract -> Load -> Transform)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA || 'public' }}
          LANDING_DIR: 'data/landing'
        run: |
          python main.py

      - name: 🔍 Inspect Data Warehouse Results
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA || 'public' }}
        run: |
          python view_dw_tables.py
