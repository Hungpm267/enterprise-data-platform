name: Automated E-Commerce Prefect ELT Pipeline

on:
  schedule:
    # Runs automatically every 45 minutes continuously
    - cron: '*/45 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Web UI
  push:
    branches: [ main ]

jobs:
  run-elt-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10 & Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 📦 Fast Install Dependencies (Cached)
        run: |
          pip install --prefer-binary -r requirements.txt

      - name: 🔑 Check Secrets Configuration
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Checking Secrets availability..."
          [ -n "$DB_HOST" ] && echo "✓ DB_HOST secret found" || echo "❌ DB_HOST secret MISSING!"
          [ -n "$DB_PORT" ] && echo "✓ DB_PORT secret found" || echo "❌ DB_PORT secret MISSING!"
          [ -n "$DB_NAME" ] && echo "✓ DB_NAME secret found" || echo "❌ DB_NAME secret MISSING!"
          [ -n "$DB_USER" ] && echo "✓ DB_USER secret found" || echo "❌ DB_USER secret MISSING!"
          [ -n "$DB_PASSWORD" ] && echo "✓ DB_PASSWORD secret found" || echo "❌ DB_PASSWORD secret MISSING!"

      - name: 🚀 Execute Prefect ELT Pipeline (Extract -> Load -> Transform)
        env:
          PYTHONPATH: .
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
          LANDING_DIR: 'data/landing'
        run: |
          python main.py

      - name: 🔍 Inspect Data Warehouse Results
        env:
          PYTHONPATH: .
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
        run: |
          python view_dw_tables.py

      - name: 📢 Send Detailed Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram Secrets not configured yet. Skipping Telegram notification."
            exit 0
          fi

          WORKFLOW_STATUS="${{ job.status }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TRIGGER_EVENT="${{ github.event_name }}"
          
          if [ "$TRIGGER_EVENT" = "schedule" ]; then
            EVENT_DESC="⏰ Lập lịch tự động (45m/lần)"
          elif [ "$TRIGGER_EVENT" = "workflow_dispatch" ]; then
            EVENT_DESC="👤 Kích hoạt thủ công (Web UI)"
          else
            EVENT_DESC="📦 Push Commit (${SHORT_SHA})"
          fi

          if [ "$WORKFLOW_STATUS" = "success" ]; then
            MESSAGE="🎉 *PREFECT ELT PIPELINE SUCCESS* 🟢%0A%0A📌 *Repository:* \`${{ github.repository }}\`%0A🌿 *Branch:* \`${{ github.ref_name }}\`%0A💡 *Nguồn kích hoạt:* ${EVENT_DESC}%0A⚙️ *Orchestrator:* \`Prefect 3.x / 2.x\`%0A🗄️ *Data Warehouse:* \`PostgreSQL (Aiven Cloud)\`%0A%0A📋 *Tóm Tắt Các Bước Đã Chạy:*%0A1️⃣ *Extract Task:* Trích xuất 6 bảng thô (\`customers\`, \`orders\`, \`order_items\`, \`payments\`, \`products\`, \`reviews\`) ➔ Parquet.%0A2️⃣ *Load Task:* Nạp Parquet thô vào DW (\`staging.stg_raw_*\`).%0A3️⃣ *Transform Task:* Thực thi SQL models ➔ Star Schema Data Marts (\`marts.dim_*\`, \`marts.fct_*\`).%0A%0A✅ *Kết quả:* Dữ liệu sẵn sàng phục vụ Power BI / Metabase!%0A%0A🔗 [🌐 Xem Chi Tiết Log Execution Trên GitHub]($RUN_URL)"
          else
            MESSAGE="🚨 *PREFECT ELT PIPELINE FAILED* 🔴%0A%0A📌 *Repository:* \`${{ github.repository }}\`%0A🌿 *Branch:* \`${{ github.ref_name }}\`%0A💡 *Nguồn kích hoạt:* ${EVENT_DESC}%0A⚙️ *Orchestrator:* \`Prefect 3.x / 2.x\`%0A🗄️ *Data Warehouse:* \`PostgreSQL (Aiven Cloud)\`%0A%0A⚠️ *Trạng thái:* Phát sinh sự cố trong quá trình Extract, Load hoặc SQL Transform!%0A%0A🔗 [🔍 Kiểm Tra Nhật Ký Lỗi Trực Tiếp Trên GitHub]($RUN_URL)"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "text=${MESSAGE}"
