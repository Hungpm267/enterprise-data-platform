name: Scheduled 4-Hour Enterprise ELT Pipeline

on:
  schedule:
    # Run every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      connector:
        description: 'Target connector to execute (postgres_db, crypto_api, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - postgres_db
          - crypto_api
      full_refresh:
        description: 'Run dbt full-refresh rebuild'
        required: false
        default: false
        type: boolean

jobs:
  run-elt-pipeline:
    name: Run End-to-End ELT Pipeline & Quality Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SCHEMA: ${{ secrets.DB_SCHEMA || 'public' }}
      PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
      PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'data-engineering-504901' }}
      GCP_GCS_BUCKET: ${{ secrets.GCP_GCS_BUCKET || 'ecommerce-data-lake-504901' }}
      GCP_STAGING_DATASET: ${{ secrets.GCP_STAGING_DATASET || 'staging' }}
      GCP_MARTS_DATASET: ${{ secrets.GCP_MARTS_DATASET || 'marts' }}
      GCP_KEY_FILE: 'gcp_key.json'
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      LANDING_DIR: 'data/landing'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Platform & dbt Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dbt-bigquery==1.9.0

      - name: Authenticate with Google Cloud
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" > gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS="gcp_key.json"

      - name: Run Postgres E-Commerce Pipeline
        if: "${{ github.event_name == 'schedule' || inputs.connector == 'all' || inputs.connector == 'postgres_db' }}"
        run: |
          REFRESH_FLAG=""
          if [ "${{ inputs.full_refresh }}" = "true" ]; then
            REFRESH_FLAG="--full-refresh"
          fi
          python main.py --connector postgres_db $REFRESH_FLAG

      - name: Run CoinGecko Crypto Market API Pipeline
        if: "${{ github.event_name == 'schedule' || inputs.connector == 'all' || inputs.connector == 'crypto_api' }}"
        run: |
          REFRESH_FLAG=""
          if [ "${{ inputs.full_refresh }}" = "true" ]; then
            REFRESH_FLAG="--full-refresh"
          fi
          python main.py --connector crypto_api $REFRESH_FLAG

      - name: Send Detailed Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram Secrets not configured. Skipping Telegram notification."
            exit 0
          fi

          WORKFLOW_STATUS="${{ job.status }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VN_TIMESTAMP=$(TZ='Asia/Ho_Chi_Minh' date '+%d/%m/%Y %H:%M:%S')
          TARGET_CONNECTOR="${{ inputs.connector || 'all' }}"
          
          if [ "${{ github.event_name }}" = "schedule" ]; then
            EVENT_DESC="⏰ Scheduled Cron (Every 4 Hours)"
          else
            EVENT_DESC="🔘 Manual Dispatch (Connector: ${TARGET_CONNECTOR})"
          fi

          if [ "$WORKFLOW_STATUS" = "success" ]; then
            MESSAGE="🟢 *4-HOUR ELT PIPELINE SUCCESS* 🚀%0A%0A📁 *Repository:* \`${{ github.repository }}\`%0A🌿 *Branch:* \`${{ github.ref_name }}\`%0A⚡ *Trigger:* ${EVENT_DESC}%0A🕒 *Thời gian (VN UTC+7):* \`${VN_TIMESTAMP}\`%0A☁️ *Data Lake:* \`Google Cloud Storage (GCS)\`%0A🏢 *Data Warehouse:* \`Google BigQuery\`%0A🛠️ *Transform Engine:* \`dbt-bigquery\`%0A%0A✅ *Status:* Pipeline executed and all 35 Data Quality Tests PASSED!%0A%0A🔗 [Xem Chi Tiết Log Trên GitHub Actions](${RUN_URL})"
          else
            MESSAGE="🔴 *4-HOUR ELT PIPELINE FAILED* ⚠️%0A%0A📁 *Repository:* \`${{ github.repository }}\`%0A🌿 *Branch:* \`${{ github.ref_name }}\`%0A⚡ *Trigger:* ${EVENT_DESC}%0A🕒 *Thời gian (VN UTC+7):* \`${VN_TIMESTAMP}\`%0A❌ *Status:* Pipeline failed during execution.%0A%0A🔍 [Kiểm Tra Chi Tiết Lỗi Trên GitHub Actions](${RUN_URL})"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "text=${MESSAGE}"

      - name: Cleanup Credentials
        if: always()
        run: |
          rm -f gcp_key.json